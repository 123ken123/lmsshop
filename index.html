<!DOCTYPE html>
<html lang="vi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>LMS360 VIP Gateway - Clan</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
        body { background: #0f172a; color: #f8fafc; display: flex; justify-content: center; align-items: center; min-height: 100vh; padding: 20px; }
        .card { background: #1e293b; width: 100%; max-width: 450px; padding: 30px; border-radius: 16px; box-shadow: 0 10px 25px rgba(0,0,0,0.5); border: 1px solid #334155; text-align: center; }
        .badge { background: #3b82f6; color: #fff; padding: 4px 12px; border-radius: 20px; font-size: 12px; font-weight: bold; text-transform: uppercase; letter-spacing: 1px; }
        h2 { margin: 15px 0 5px; font-size: 24px; font-weight: 700; color: #fff; }
        p.subtitle { color: #94a3b8; font-size: 14px; margin-bottom: 25px; }
        .input-group { margin-bottom: 20px; text-align: left; }
        label { display: block; font-size: 13px; color: #cbd5e1; margin-bottom: 8px; font-weight: 600; }
        input { width: 100%; padding: 14px; border-radius: 8px; border: 1px solid #475569; background: #0f172a; color: #38bdf8; font-size: 16px; font-weight: bold; text-align: center; outline: none; transition: 0.3s; }
        input:focus { border-color: #3b82f6; box-shadow: 0 0 10px rgba(59, 130, 246, 0.4); }
        button { width: 100%; background: #2563eb; color: white; border: none; padding: 14px; border-radius: 8px; font-size: 16px; font-weight: bold; cursor: pointer; transition: 0.2s; }
        button:hover { background: #1d4ed8; }
        #output { margin-top: 20px; text-align: left; display: none; }
        textarea { width: 100%; height: 110px; background: #0f172a; color: #4ade80; border: 1px solid #334155; border-radius: 8px; padding: 10px; font-family: monospace; font-size: 12px; resize: none; margin-top: 8px; }
    </style>
</head>
<body>

    <div class="card">
        <span class="badge">Clan LMS360 Tool</span>
        <h2>Xác Thực Key Bản Quyền</h2>
        <p class="subtitle">Nhập mã Key do Bot Discord cấp để nhận Script</p>

        <div class="input-group">
            <label>MÃ KEY BẢN QUYỀN:</label>
            <input type="text" id="userKey" placeholder="CLAN-XXXX-XXXX" autocomplete="off">
        </div>

        <button onclick="checkKey()">KÍCH HOẠT SCRIPT</button>

        <div id="output">
            <label style="color:#4ade80;">✅ XÁC THỰC THÀNH CÔNG! ĐOẠN SCRIPT CỦA BẠN:</label>
            <textarea id="scriptCode" readonly></textarea>
            <button style="background: #10b981; margin-top: 10px;" onclick="copyScript()">📋 Copy Mã Script</button>
        </div>
    </div>

    <script>
        // Danh sách các Key hợp lệ (Khớp với dữ liệu Bot tạo ra)
        const validKeys = [
            "CLAN-VA9H-A08G",
"CLAN-QUZX-FV2H"
        ];

        // Đoạn code script LMS360 đã được làm rối (Obfuscated) bảo mật
        const obfuscatedScript = `/* DÁN ĐOẠN CODE ĐÃ MÃ HÓA TỪ OBFUSCATOR.IO VÀO ĐÂY */`;

        function checkKey() {
            let key = document.getElementById('userKey').value.trim();
            let output = document.getElementById('output');
            let scriptArea = document.getElementById('scriptCode');

            if (validKeys.includes(key)) {
                scriptArea.value = obfuscatedScript;
                output.style.display = 'block';
            } else {
                alert("❌ Key không chính xác hoặc đã bị vô hiệu hóa!");
                output.style.display = 'none';
            }
        }

        function copyScript() {
            let code = document.getElementById('scriptCode');
            code.select();
            document.execCommand("copy");
            alert("📋 Đã sao chép mã script! Mở F12 Console trên LMS360 và dán vào để chạy.");
        }
    </script>
</body>
</html>
